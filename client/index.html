<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediKiosk</title>
</head>

<body>
  <div id="google_translate_element" style="display: none;"></div>
  <div id="root"></div>

  <script type="text/javascript">
    // Prevent a stale Google Translate cookie (for example, Bengali) from choosing
    // a language before React has loaded an explicit user or profile preference.
    (function setInitialTranslateLanguage() {
      var supportedLanguages = ["en", "hi", "gu", "kn", "ml", "mr", "ta", "te", "or", "as", "pa"];
      var savedLanguage = localStorage.getItem("medikiosk_language");
      var hasExplicitPreference = localStorage.getItem("medikiosk_language_preference_confirmed") === "true";
      var language = hasExplicitPreference && supportedLanguages.indexOf(savedLanguage) !== -1 ? savedLanguage : "en";
      var cookieValue = "googtrans=/en/" + language + "; path=/;";
      document.cookie = cookieValue;

      var host = window.location.hostname;
      if (host && host !== "localhost" && host.indexOf("127.") !== 0) {
        var parts = host.split(".");
        if (parts.length > 1) {
          document.cookie = cookieValue + " domain=." + parts.slice(-2).join(".") + ";";
        }
      }
    })();

    function googleTranslateElementInit() {
      if (window.google && window.google.translate) {
        new window.google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,hi,gu,kn,ml,mr,ta,te,or,as,pa",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    }

    // Continuously suppress Google Translate banner and body offset
    if (typeof MutationObserver !== "undefined") {
      const observer = new MutationObserver(() => {
        if (document.body) {
          if (document.body.style.top && document.body.style.top !== "0px") {
            document.body.style.setProperty("top", "0px", "important");
          }
          if (document.body.style.position && document.body.style.position !== "static") {
            document.body.style.setProperty("position", "static", "important");
          }
          document
            .querySelectorAll("body > .skiptranslate, .goog-te-banner-frame, iframe.skiptranslate")
            .forEach((el) => {
              if (el.id !== "google_translate_element") {
                el.style.setProperty("display", "none", "important");
                el.style.setProperty("visibility", "hidden", "important");
                el.style.setProperty("height", "0", "important");
              }
            });
        }
      });
      observer.observe(document.documentElement, {
        attributes: true,
        childList: true,
        subtree: true,
      });
    }
  </script>
  <script
    type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
  ></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
